<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESG Request Desk intake</title>
  <meta name="description" content="Vállalati biztonsági, facility management és compliance megkeresések kontrollált intake felülete.">
  <link rel="stylesheet" href="/enterprise-request-desk.css">
</head>
<body>
  <main class="erdp-intake-shell" data-erdp-intake-shell>
    <header class="erdp-public-header">
      <a class="erdp-public-brand" href="/enterprise-request-desk/intake" aria-label="ESG Request Desk intake">
        <span class="erdp-mark" aria-hidden="true">E</span>
        <span>
          <strong>ESG Request Desk</strong>
          <small>Vállalati megkeresés</small>
        </span>
      </a>
      <p>Request-only intake. Staff review dönt a következő lépésről.</p>
    </header>

    <section class="erdp-intake-stage" aria-label="ESG Request Desk megkeresés">
      <div class="erdp-status" id="erdp-intake-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="erdp-intake-root">
        <section class="erdp-loading" aria-label="ESG Request Desk betöltése">
          <span class="erdp-loader" aria-hidden="true"></span>
          <div>
            <h1>ESG Request Desk betöltése</h1>
            <p>Ellenőrizzük a publikus intake linket.</p>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="/enterprise-request-desk-intake.js"></script>
</body>
</html>
