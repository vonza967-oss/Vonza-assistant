<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajánlatkérés</title>
  <meta name="description" content="Gyors, magyar nyelvű ajánlatkérési asszisztens.">
  <link rel="stylesheet" href="/qdh-product.css">
</head>
<body>
  <main class="qdh-intake-shell" data-qdh-intake-shell>
    <header class="qdh-intake-header">
      <a class="qdh-intake-brand" href="/" aria-label="Ajánlatkérés">
        <span class="qdh-intake-brand-mark" aria-hidden="true">A</span>
        <strong>Ajánlatkérés</strong>
      </a>
      <p class="qdh-intake-header-note">
        A pontos árat a vállalkozás erősíti meg.
      </p>
    </header>

    <section class="qdh-intake-stage" aria-label="Ajánlatkérő asszisztens">
      <div class="qdh-intake-status" id="qdh-intake-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="qdh-intake-root">
        <section class="qdh-intake-loading" aria-label="Ajánlatkérő betöltése">
          <span class="qdh-intake-loader" aria-hidden="true"></span>
          <div>
            <h1>Ajánlatkérő betöltése</h1>
            <p>Ellenőrizzük a vállalkozás ajánlatkérő linkjét.</p>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="/qdh-intake.js"></script>
</body>
</html>
